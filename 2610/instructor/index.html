  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  var h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();
}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}
if(!window.crypto||!crypto.subtle){document.getElementById('m').textContent='이 주소는 https로 열어야 합니다';}
else{var saved=ss('ws-pw');if(saved)open_(saved).catch(function(){});}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var pw=document.getElementById('pw').value.trim();
  document.getElementById('m').textContent='';
  open_(pw).then(function(){ss('ws-pw',pw)}).catch(function(){document.getElementById('m').textContent='비밀번호가 맞지 않습니다';});});
</script></body></html>
